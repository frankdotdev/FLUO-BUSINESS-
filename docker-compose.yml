# Local production-like stack:  cp apps/web/.env.example .env  (set DATABASE_URL to the db below) then  docker compose up --build
services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: fluo, POSTGRES_PASSWORD: fluo, POSTGRES_DB: fluo }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fluo"], interval: 5s, timeout: 3s, retries: 10 }
  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: migrate }
    environment: { DATABASE_URL: "postgres://fluo:fluo@db:5432/fluo", DB_SSL: "disable" }
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: runner }
    env_file: .env
    environment: { DB_SSL: "disable" }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes: { pgdata: {} }
